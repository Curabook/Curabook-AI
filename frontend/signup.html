<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Curabook PHI</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --brand: #00BCD5; --brand-dark: #0097a7; --text: #111111; --muted: #6b7280; --border: #e5e7eb; --bg: #fafafa; --white: #ffffff; --font: 'Plus Jakarta Sans',sans-serif; --serif: 'Instrument Serif',serif; }
    body { font-family: var(--font); min-height: 100vh; display: flex; background: var(--bg); -webkit-font-smoothing: antialiased; }
    .left-panel { flex: 1; background: #0a0a0a; display: flex; flex-direction: column; justify-content: space-between; padding: 48px; position: relative; overflow: hidden; }
    .left-panel::before { content:''; position:absolute; top:-80px; right:-80px; width:380px; height:380px; background:radial-gradient(circle, rgba(0,188,213,.15) 0%, transparent 70%); pointer-events:none; }
    .left-brand { display:flex; align-items:center; gap:12px; z-index:1; }
    .left-brand-icon { width:40px; height:40px; background:var(--brand); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-size:18px; }
    .left-brand-name { font-family:var(--serif); font-size:1.4rem; color:white; font-weight:400; }
    .left-brand-tag { font-size:11px; background:rgba(0,188,213,.2); color:var(--brand); padding:2px 8px; border-radius:20px; font-weight:600; }
    .left-content { z-index:1; }
    .left-headline { font-family:var(--serif); font-size:clamp(1.8rem,3vw,2.6rem); color:white; line-height:1.2; letter-spacing:-.5px; margin-bottom:20px; }
    .left-headline em { color:var(--brand); font-style:italic; }
    .left-sub { font-size:15px; color:rgba(255,255,255,.5); line-height:1.65; max-width:380px; margin-bottom:32px; }
    .feature-list { display:flex; flex-direction:column; gap:16px; z-index:1; }
    .feature-item { display:flex; align-items:flex-start; gap:12px; }
    .feature-icon { width:32px; height:32px; background:rgba(0,188,213,.15); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--brand); font-size:13px; flex-shrink:0; }
    .feature-text h4 { font-size:13.5px; font-weight:600; color:rgba(255,255,255,.9); margin-bottom:2px; }
    .feature-text p { font-size:12px; color:rgba(255,255,255,.4); line-height:1.4; }
    .right-panel { width:520px; background:var(--white); display:flex; align-items:center; justify-content:center; padding:48px 52px; }
    .form-container { width:100%; max-width:400px; }
    .form-header { margin-bottom:28px; }
    .form-title { font-family:var(--serif); font-size:1.8rem; font-weight:400; color:var(--text); letter-spacing:-.3px; margin-bottom:6px; }
    .form-sub { font-size:14px; color:var(--muted); }
    .form-sub a { color:var(--brand); text-decoration:none; font-weight:500; }
    .name-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-group { margin-bottom:16px; }
    .form-label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:7px; }
    .form-label .optional { font-weight:400; color:var(--muted); font-size:12px; }
    .form-input { width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px; font-size:14.5px; font-family:var(--font); color:var(--text); background:var(--white); outline:none; transition:border-color .2s,box-shadow .2s; }
    .form-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(0,188,213,.1); }
    .password-hint { font-size:12px; color:var(--muted); margin-top:5px; }
    .terms-row { display:flex; align-items:flex-start; gap:9px; margin-bottom:18px; font-size:12.5px; color:var(--muted); line-height:1.5; }
    .terms-row input[type="checkbox"] { margin-top:2px; accent-color:var(--brand); flex-shrink:0; width:14px; height:14px; }
    .terms-row a { color:var(--brand); text-decoration:none; }
    .btn-primary { width:100%; padding:13px; background:var(--brand); color:white; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:16px; }
    .divider { display:flex; align-items:center; gap:12px; margin-bottom:16px; font-size:12px; color:var(--muted); }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .btn-google { width:100%; padding:12px; background:white; border:1.5px solid var(--border); border-radius:10px; font-size:14.5px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:20px; }
    .btn-google img { width:18px; height:18px; }
    .status-msg { text-align:center; font-size:13.5px; min-height:20px; margin-bottom:10px; font-weight:500; }
    .status-msg.error { color:#ef4444; }
    .status-msg.success { color:var(--brand); }
    .compliance-strip { text-align:center; font-size:11.5px; color:#9ca3af; padding-top:16px; border-top:1px solid var(--border); margin-top:4px; }
    .compliance-strip i { color:var(--brand); margin-right:4px; }
    
    #onboardingStep { display: none; animation: fadeIn .35s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .onboarding-header { margin-bottom:24px; }
    .onboarding-header h2 { font-family:var(--serif); font-size:1.6rem; font-weight:400; margin-bottom:6px; color:var(--text); }
    .onboarding-header p { font-size:13.5px; color:var(--muted); line-height:1.6; }
    .onboarding-progress { display:flex; gap:4px; margin-bottom:24px; }
    .op-dot { flex:1; height:3px; background:var(--border); border-radius:2px; transition:background .3s; }
    .op-dot.active { background:var(--brand); }
    .glp1-option-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px; }
    .glp1-option { border:1.5px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; text-align:left; background:white; font-family:var(--font); }
    .glp1-option.selected { border-color:var(--brand); background:rgba(0,188,213,.06); }
    .glp1-option-icon { font-size:1.4rem; margin-bottom:6px; }
    .glp1-option-label { font-size:13px; font-weight:600; display:block; }
    .glp1-option-desc { font-size:11.5px; color:var(--muted); }
    .concern-list { display:flex; flex-direction:column; gap:7px; }
    .concern-item { border:1.5px solid var(--border); border-radius:10px; padding:11px 14px; cursor:pointer; text-align:left; background:white; font-family:var(--font); display:flex; align-items:center; gap:10px; }
    .concern-item.selected { border-color:var(--brand); background:rgba(0,188,213,.06); }
    .concern-label { font-size:13.5px; font-weight:500; }
    .onboarding-nav { display:flex; gap:10px; margin-top:20px; }
    .btn-back { flex:1; padding:12px; background:none; border:1.5px solid var(--border); border-radius:10px; font-size:14px; cursor:pointer; color:var(--muted); }
    .btn-next { flex:2; padding:12px; background:var(--brand); border:none; border-radius:10px; font-size:14px; font-weight:600; color:white; cursor:pointer; }
    
    .success-state { display:none; text-align:center; padding:24px 0; }
    .success-icon { width:64px; height:64px; border-radius:50%; background:rgba(0,188,213,.12); border:2px solid var(--brand); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:28px; color:var(--brand); }
    .success-title { font-family:var(--serif); font-size:1.7rem; color:var(--text); margin-bottom:10px; }
    .success-body { font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:22px; }
    @media (max-width:900px) { .left-panel { display:none; } .right-panel { width:100%; padding:40px 24px; } }
    </style>
</head>
<body>

<div class="left-panel">
    <div class="left-brand"><div class="left-brand-icon"><i class="fa-solid fa-heart-pulse"></i></div><span class="left-brand-name">Curabook</span><span class="left-brand-tag">PHI</span></div>
    <div class="left-content"><h1 class="left-headline">Stay ahead<br>of the <em>GLP-1 cliff</em><br>with your data</h1></div>
</div>

<div class="right-panel">
    <div class="form-container">
        <div id="signupStep">
            <div class="form-header"><h2 class="form-title">Create your account</h2><p class="form-sub">Already have one? <a href="/login">Sign in</a></p></div>
            <p id="status-msg" class="status-msg"></p>
            <div class="name-row">
                <div class="form-group"><label class="form-label">First name</label><input type="text" id="firstName" class="form-input"></div>
                <div class="form-group"><label class="form-label">Last name</label><input type="text" id="lastName" class="form-input"></div>
            </div>
            <div class="form-group"><label class="form-label">Email address</label><input type="email" id="email" class="form-input"></div>
            <div class="form-group"><label class="form-label">Password</label><input type="password" id="password" class="form-input"></div>
            <div class="terms-row"><input type="checkbox" id="termsCheck"><span>I agree to the Terms of Service and Privacy Policy.</span></div>
            <button id="signupBtn" class="btn-primary">Create Free Account</button>
            <div class="divider">or</div>
            <button id="googleBtn" class="btn-google"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Continue with Google</button>
        </div>

        <div id="onboardingStep">
            <div class="onboarding-progress"><div class="op-dot active" id="dot1"></div><div class="op-dot" id="dot2"></div><div class="op-dot" id="dot3"></div><div class="op-dot" id="dot4"></div><div class="op-dot" id="dot5"></div></div>
            <div id="panelA">
                <div class="onboarding-header"><h2>One last thing</h2></div>
                <div class="glp1-option-grid">
                    <button class="glp1-option" data-val="active" onclick="selectOption(this,'glp1Status')"><span class="glp1-option-label">On medication</span></button>
                    <button class="glp1-option" data-val="never" onclick="selectOption(this,'glp1Status')"><span class="glp1-option-label">Never been on one</span></button>
                </div>
                <div class="onboarding-nav"><button class="btn-next" id="nextA" onclick="goToPanel('B')" disabled>Continue →</button></div>
            </div>
            <div id="panelB" style="display:none">
                <div class="onboarding-header"><h2>Which medication?</h2></div>
                <select id="medName" class="form-input"><option value="">Select medication…</option><option value="Zepbound">Zepbound</option><option value="Wegovy">Wegovy</option><option value="Ozempic">Ozempic</option><option value="Other">Other</option></select>
                <div class="onboarding-nav"><button class="btn-back" onclick="goToPanel('A')">← Back</button><button class="btn-next" id="nextB" onclick="goToPanel('C')" disabled>Continue →</button></div>
            </div>
            <div id="panelC" style="display:none">
                <div class="onboarding-header"><h2>What's your goal weight?</h2></div>
                <input type="number" id="goalWeight" class="form-input" placeholder="e.g. 165" min="80" max="400">
                <div class="onboarding-nav"><button class="btn-back" onclick="goToPanel('B')">← Back</button><button class="btn-next" id="nextC" onclick="goToPanel('D')" disabled>Continue →</button></div>
            </div>
            <div id="panelD" style="display:none">
                <div class="onboarding-header"><h2>Biggest concern?</h2></div>
                <div class="concern-list">
                    <button class="concern-item" data-val="food_noise" onclick="selectOption(this,'concern')"><span class="concern-label">Food noise</span></button>
                    <button class="concern-item" data-val="muscle_loss" onclick="selectOption(this,'concern')"><span class="concern-label">Muscle loss</span></button>
                </div>
                <div class="onboarding-nav"><button class="btn-back" onclick="goToPanel('C')">← Back</button><button class="btn-next" id="nextD" onclick="finishOnboarding()" disabled>Start PHI →</button></div>
            </div>
        </div>

        <div id="successState" class="success-state">
            <h2 class="success-title">Check your email</h2>
            <p class="success-link">Already confirmed? <a href="/login">Sign in →</a></p>
        </div>
    </div>
</div>

<script>
const API_BASE = "https://api.curabook.com";
let supabaseClient = null; let _userId = null; let _accessToken = null;
const ob = { glp1Status: null, medName: null, goalWeight: null, concern: null };

function initSupabase() {
    const SUPABASE_URL = "https://pbeaawlxdcrdbvlmpqhc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiZWFhd2x4ZGNyZGJ2bG1wcWhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMDk0MzksImV4cCI6MjA5MTU4NTQzOX0.6bUpYrDbe0mQjjBHX8Qscj-5R8i4-SqAtW_Z1UFzJ10";
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { detectSessionInUrl: true, persistSession: true } });
}

function setStatus(msg, type='') { document.getElementById('status-msg').textContent = msg; document.getElementById('status-msg').className = 'status-msg ' + type; }
function goToPanel(panel) { ['A','B','C','D'].forEach(p => { document.getElementById('panel' + p).style.display = p === panel ? 'block' : 'none'; }); }

function selectOption(btn, field) {
    btn.closest('.glp1-option-grid, .concern-list').querySelectorAll('.glp1-option, .concern-item').forEach(el => el.classList.remove('selected'));
    btn.classList.add('selected'); ob[field] = btn.dataset.val;
    if (field === 'glp1Status') { document.getElementById('nextA').disabled = false; if (ob.glp1Status === 'never') ob.medName = 'none'; }
    if (field === 'concern') { document.getElementById('nextD').disabled = false; }
}

document.addEventListener('DOMContentLoaded', () => {
    const gwInput = document.getElementById('goalWeight');
    if (gwInput) { gwInput.addEventListener('input', () => { ob.goalWeight = parseFloat(gwInput.value); document.getElementById('nextC').disabled = !(ob.goalWeight >= 80 && ob.goalWeight <= 400); }); }
    const medSelect = document.getElementById('medName');
    if (medSelect) { medSelect.addEventListener('change', () => { ob.medName = medSelect.value || null; document.getElementById('nextB').disabled = !medSelect.value; }); }
});

async function finishOnboarding() {
    if (_userId && _accessToken) {
        try {
            await fetch(`${API_BASE}/api/consent`, { method: 'POST', headers: {'Content-Type':'application/json','Authorization':'Bearer '+_accessToken}, body: JSON.stringify({consents:['data_processing','ai_processing','document_processing']}) });
            await supabaseClient.from('glp1_onboarding').upsert({ user_id: _userId, glp1_status: ob.glp1Status, medication_name: ob.medName, goal_weight_lbs: ob.goalWeight, primary_concern: ob.concern }, {onConflict:'user_id'});
            if (ob.goalWeight) await supabaseClient.from('user_profiles').upsert({ user_id: _userId, goal_weight_lbs: ob.goalWeight, glp1_status: ob.glp1Status }, {onConflict:'user_id'});
        } catch(e) {}
    }
    localStorage.setItem('phi_goal_wt', String(ob.goalWeight || 165));
    window.location.href = '/app.html';
}

document.getElementById('signupBtn').addEventListener('click', async () => {
    if (!supabaseClient) return;
    const email = document.getElementById('email').value.trim(); const password = document.getElementById('password').value;
    if (!email || !password || !document.getElementById('termsCheck').checked) { setStatus('Fill out all fields.', 'error'); return; }
    try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { first_name: document.getElementById('firstName').value }, redirectTo: `${window.location.origin}/login` } });
        if (error) { setStatus(error.message, 'error'); return; }
        if (data.user) { _userId = data.user.id; localStorage.setItem(`phi_terms_${data.user.id}`, Date.now().toString()); }
        if (data.session) { _accessToken = data.session.access_token; document.getElementById('signupStep').style.display = 'none'; document.getElementById('onboardingStep').style.display = 'block'; } 
        else { document.getElementById('signupStep').style.display = 'none'; document.getElementById('successState').style.display = 'block'; }
    } catch (err) { setStatus('Error creating account.', 'error'); }
});

document.getElementById('googleBtn').addEventListener('click', async () => {
    if (!supabaseClient) return;
    // IMPORTANT FIX: Return to /login so the Terms popup fires
    await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: `${window.location.origin}/login` } }); 
});

try { initSupabase(); } catch(err) { setStatus('App failed to load. Please refresh.', 'error'); }
</script>
</body>
</html>
